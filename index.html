<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EPMS Field Kit</title>
<meta name="theme-color" content="#1c2228">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Field Kit">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* Field tool, phone first. System fonts only so nothing depends on the internet. */
:root{
  --bg:#eef0f2; --panel:#fff; --ink:#1b2128; --muted:#5d6874; --line:#d5dae0; --chip:#f3f5f7;
  --accent:#e0a000; --accent-ink:#1b2128; --link:#1f5fbf; --focus:#2c6fd6;
  --ok:#1f8a4c; --warn:#a8630a; --bad:#c8372d; --info:#2c6fd6; --mark:#ffe08a; --glow:rgba(229,57,53,.55);
  --f:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#13171b; --panel:#1c2228; --ink:#e7ebef; --muted:#97a2ad; --line:#2d353d; --chip:#242b32;
  --accent:#f0b429; --accent-ink:#13171b; --link:#7fb0ff; --focus:#6aa2ff;
  --ok:#3cb371; --warn:#f0a542; --bad:#ef5b50; --info:#5c95f0; --mark:#6b5414; --glow:rgba(255,72,66,.75); color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
html{min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}
.gutter{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.in{max-width:760px;margin:0 auto}

header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.hrow{display:flex;align-items:center;gap:10px;padding-block:10px}
.logo{width:30px;height:30px;border-radius:6px;flex:none}
h1{font-size:17px;margin:0;font-weight:700}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync.on .dot{background:var(--ok)} .sync.stale .dot{background:var(--warn)} .sync.old .dot{background:var(--bad)}
.sync.stale{color:var(--warn)} .sync.old{color:var(--bad)}
.syncbtn{margin-left:auto;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 10px;font-size:13px;font-weight:600;cursor:pointer}

main{padding-block:14px calc(88px + env(safe-area-inset-bottom))}
section{display:flex;flex-direction:column;gap:12px}
h2{font-size:20px;margin:4px 0 0}
h3{font-size:16px;margin:0}
.label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:13px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.55;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.banner{border-radius:10px;padding:12px 14px;border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:8px}
.banner.warn{border-color:var(--warn)} .banner.bad{border-color:var(--bad)}
.empty{border:1.5px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--muted)}

/* search */
.sbox{display:flex;flex-direction:column;gap:8px;position:sticky;top:calc(53px + env(safe-area-inset-top));z-index:4;background:var(--bg);padding-block:4px 8px}
#q{width:100%;font-size:17px;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel)}
#q:focus{border-color:var(--accent);outline:none}
select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%}
.res{display:flex;flex-direction:column;gap:8px}
.hit{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:left;width:100%;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.hit:active{border-color:var(--accent)}
.hmeta{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:13px}
.dev{font-weight:700}
.pg{font-family:var(--mono);font-size:12px;color:var(--muted);margin-left:auto;white-space:nowrap}
.snip{font-size:14px;overflow-wrap:anywhere}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.rev{display:inline-block;font-family:var(--mono);font-size:12px;color:var(--muted);background:var(--chip);border-radius:4px;padding:1px 6px;margin-top:2px;white-space:nowrap;align-self:flex-start}
.rev.undated{color:var(--warn)}
.doc .t .rev{margin-left:0;display:table;margin-top:3px}
.grade{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;border-radius:99px;border:1.5px solid currentColor;white-space:nowrap;margin-top:2px}
.g-answer{color:var(--ok)} .g-strong{color:var(--info)} .g-match{color:var(--muted)} .g-partial{color:var(--muted);border-style:dashed}
.fwver{font-size:15px}
.fw.new > .bar.bar{background:var(--bad);box-shadow:0 0 8px var(--glow)}
.fwname{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.fwalert{color:var(--bad);font-style:italic;font-weight:800;font-size:14px;text-shadow:0 0 6px var(--glow),0 0 14px var(--glow);animation:fwglow 1.6s ease-in-out infinite}
@keyframes fwglow{0%,100%{text-shadow:0 0 4px var(--glow),0 0 8px var(--glow)}50%{text-shadow:0 0 10px var(--glow),0 0 22px var(--glow),0 0 32px var(--glow)}}
@media (prefers-reduced-motion:reduce){.fwalert{animation:none}}
.guide{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;width:100%}
.guide .meter{margin-top:4px}
.fixsec{display:flex;flex-direction:column;gap:6px}
.fixsec h3{font-size:15px;margin:6px 0 0}
.step{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:26px 1fr;gap:4px 10px;align-items:start}
.step input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--ok)}
.step .st{min-width:0;display:flex;flex-direction:column;gap:5px}
.step .st label{font-weight:600;cursor:pointer}
.step.done{opacity:.6}
.step.done .st label{text-decoration:line-through}
.step.safety{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 8%,var(--panel))}
.step.safety .st label::before{content:"⚠ ";color:var(--warn)}
.lookbtn{align-self:flex-start;border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:5px 11px;font-size:13px;cursor:pointer;color:var(--link)}
.anscard{background:var(--panel);border:2px solid var(--ok);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.ansval{font-family:var(--mono);font-size:22px;font-weight:700;overflow-wrap:anywhere}
.mono{font-family:var(--mono)}
.notsaved{font-size:11px;font-weight:700;color:var(--warn);text-transform:uppercase;letter-spacing:.05em}
.tips{display:flex;flex-wrap:wrap;gap:6px}
.tips button{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:6px 11px;font-size:13px;cursor:pointer}

/* library */
.cat{display:flex;flex-direction:column;gap:8px}
.devcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.dhead{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.dhead>div{min-width:0}
.docs{display:flex;flex-direction:column;gap:2px}
.doc{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer;width:100%}
.doc .t{min-width:0;overflow-wrap:anywhere}
.doc .m{font-size:12px;color:var(--muted);font-family:var(--mono);white-space:nowrap}
.state{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:99px;border:1.5px solid currentColor;white-space:nowrap}
.state.saved{color:var(--ok)} .state.part{color:var(--warn)} .state.none{color:var(--muted)}
.meter{height:8px;border-radius:4px;background:var(--chip);overflow:hidden}
.meter span{display:block;height:100%;background:var(--ok);width:0;transition:width .2s}

/* firmware */
.fw{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:4px 1fr;gap:0 12px}
.fw .bar{border-radius:2px;background:var(--muted)}
.fw.changed .bar,.fw.new .bar{background:var(--info)} .fw.review .bar{background:var(--warn)} .fw.error .bar{background:var(--bad)} .fw.ok .bar{background:var(--ok)}
.fw .body{display:flex;flex-direction:column;gap:4px;min-width:0}
.ver{font-family:var(--mono);font-size:14px}
.adv{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:10px;padding:10px 14px;display:flex;flex-direction:column;gap:3px}
a{color:var(--link);overflow-wrap:anywhere}

/* tabs */
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav .in{display:grid;grid-template-columns:repeat(5,1fr)}
nav button{background:none;border:0;padding:9px 2px 10px;color:var(--muted);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;position:relative}
nav button svg{width:23px;height:23px}
nav button[aria-selected="true"]{color:var(--ink)}
nav button[aria-selected="true"] svg{color:var(--accent)}
.badge{position:absolute;top:6px;left:calc(50% + 8px);min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;line-height:16px;padding:0 4px}

/* viewer */
#viewer{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column}
.vbar{background:var(--panel);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.vrow{display:flex;align-items:center;gap:8px;padding-block:8px}
.vtitle{flex:1;min-width:0;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{border:1px solid var(--line);background:var(--panel);border-radius:8px;min-width:40px;height:38px;padding:0 10px;cursor:pointer;font-weight:700}
.vctl{display:flex;align-items:center;gap:6px;padding-block:0 8px;flex-wrap:wrap}
#pgIn{width:64px;text-align:center;padding:7px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:var(--mono)}
#stage{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:12px 0 calc(12px + env(safe-area-inset-bottom))}
#pageWrap{position:relative;margin:0 auto;box-shadow:0 1px 6px rgba(0,0,0,.25);background:#fff}
#pageWrap canvas{display:block}
.hl{position:absolute;background:rgba(255,200,0,.38);mix-blend-mode:multiply;border-radius:2px;pointer-events:none}
.vmsg{padding:30px 16px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}

/* ask / chat */
#v-ask{gap:14px}
.chat{display:flex;flex-direction:column;gap:12px}
.msg-u{align-self:flex-end;max-width:88%;background:var(--accent);color:var(--accent-ink);padding:10px 13px;border-radius:14px 14px 4px 14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg-b{align-self:stretch;background:var(--panel);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.mode{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;gap:6px;align-items:center}
.mode.quote{color:var(--warn)}
.answer{overflow-wrap:anywhere;display:flex;flex-direction:column;gap:8px}
.answer p{margin:0} .answer ol,.answer ul{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px}
.srcs{display:flex;flex-direction:column;gap:6px}
.src{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--bg);text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;width:100%}
.src .hmeta{font-size:12px}
.src .snip{font-size:13.5px}
.typing{color:var(--muted);font-style:italic}
.composer{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom));z-index:5;background:var(--bg);border-top:1px solid var(--line);padding-block:8px}
.composer form{display:flex;gap:8px;align-items:flex-end}
#askIn{flex:1;min-width:0;resize:none;max-height:140px;font-size:16px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);line-height:1.35}
#askIn:focus{border-color:var(--accent);outline:none}
body.asking main{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="in gutter hrow">
  <img class="logo" src="icons/icon-192.png" alt="">
  <div style="min-width:0"><h1>EPMS Field Kit</h1><div class="sync" id="sync"><span class="dot"></span><span id="syncText">Starting…</span></div></div>
  <button class="syncbtn" id="syncBtn" type="button">Sync</button>
</div></header>

<main class="in gutter">
  <div id="banners" style="display:flex;flex-direction:column;gap:10px;margin-bottom:12px"></div>

  <section id="v-ask" hidden>
    <div class="row" style="justify-content:space-between"><h2>Ask the manuals</h2><button class="btn" id="newChat" type="button">New chat</button></div>
    <p class="small muted" style="margin:0">Answers come straight from the manuals saved on this phone. Works with no signal.</p>
    <div class="chat" id="chat"></div>
    <div class="tips" id="askTips"></div>
  </section>

  <section id="v-search">
    <div class="sbox">
      <input id="q" type="search" placeholder="Search all manuals" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="Search all manuals">
      <div class="row"><select id="qDev" aria-label="Limit to one device"></select><span class="small muted" id="qInfo"></span></div>
    </div>
    <div class="tips" id="tips"></div>
    <div class="res" id="results"></div>
  </section>

  <section id="v-library" hidden>
    <h2>Manuals on this phone</h2>
    <div class="panel" style="display:flex;flex-direction:column;gap:10px">
      <div class="row" style="justify-content:space-between"><span id="libSummary">…</span><span class="small muted" id="libVersion"></span></div>
      <div class="meter"><span id="libMeter"></span></div>
      <div class="row"><button class="btn primary" id="saveAll" type="button">Save all</button><button class="btn" id="removeAll" type="button">Remove all</button><span class="small muted" id="dlStatus"></span></div>
    </div>
    <div id="lib" style="display:flex;flex-direction:column;gap:18px"></div>
  </section>

  <section id="v-fix" hidden>
    <h2>Troubleshoot comms</h2>
    <div class="row"><label class="small muted" for="fixDev">Device</label><select id="fixDev" aria-label="Device you're working on"></select></div>
    <div id="fixBody" style="display:flex;flex-direction:column;gap:12px"></div>
  </section>

  <section id="v-firmware" hidden>
    <h2>Firmware and advisories</h2>
    <div id="fwHead"></div>
    <div id="fwList" style="display:flex;flex-direction:column;gap:8px"></div>
    <h3 style="margin-top:8px">Security advisories</h3>
    <div id="advList" style="display:flex;flex-direction:column;gap:8px"></div>
  </section>
</main>

<nav role="tablist"><div class="in">
  <button role="tab" data-v="ask" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 5h16v11H10l-5 4v-4H4z"/><path d="M8 9.5h8M8 12.5h5"/></svg>Ask</button>
  <button role="tab" data-v="search" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>Search</button>
  <button role="tab" data-v="library" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 5h6v14H4zM14 5h6v14h-6z"/></svg>Manuals</button>
  <button role="tab" data-v="fix" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M14.5 5.5a4 4 0 0 0 4.9 4.9l-8.8 8.8a2.1 2.1 0 0 1-3-3l8.8-8.8a4 4 0 0 0-1.9-1.9Z"/><path d="m4 4 3 3"/></svg>Troubleshoot</button>
  <button role="tab" data-v="firmware" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="6" y="6" width="12" height="12" rx="1.5"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></svg>Firmware<span class="badge" id="fwBadge" hidden></span></button>
</div></nav>

<div id="viewer" hidden role="dialog" aria-modal="true" aria-labelledby="vTitle">
  <div class="vbar"><div class="in gutter">
    <div class="vrow"><button class="ib" id="vBack" type="button" aria-label="Back to results">‹ Back</button><div style="flex:1;min-width:0"><div class="vtitle" id="vTitle"></div><span class="rev" id="vRev" hidden></span></div></div>
    <div class="vctl">
      <button class="ib" id="vPrev" type="button" aria-label="Previous page">‹</button>
      <input id="pgIn" inputmode="numeric" aria-label="Page number"><span class="small muted" id="pgCount"></span>
      <button class="ib" id="vNext" type="button" aria-label="Next page">›</button>
      <span style="flex:1"></span>
      <button class="ib" id="zOut" type="button" aria-label="Zoom out">−</button>
      <button class="ib" id="zFit" type="button" aria-label="Fit to width">Fit</button>
      <button class="ib" id="zIn" type="button" aria-label="Zoom in">+</button>
    </div>
  </div></div>
  <div id="stage"><div id="pageWrap"><canvas id="cv"></canvas></div><div class="vmsg" id="vMsg" hidden></div></div>
</div>
<div class="composer" id="composer" hidden><div class="in gutter"><form id="askForm" autocomplete="off">
  <textarea id="askIn" rows="1" placeholder="Ask about a device or setting" aria-label="Your question" enterkeyhint="send"></textarea>
  <button class="btn primary" id="askBtn" type="submit">Ask</button>
</form></div></div>
<div class="toast" id="toast" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
